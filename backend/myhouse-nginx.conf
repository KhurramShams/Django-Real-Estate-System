# Nginx configuration for My House Django Backend on VPS
# Place in /etc/nginx/sites-available/myhouse and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name api.yourdomain.com your_vps_ip;  # Replace with your domain or VPS IP

    # Allow uploads up to 25M (for high-res property images)
    client_max_body_size 25M;

    # Static files served directly by Nginx (fast caching)
    location /static/ {
        alias /home/ubuntu/RealState/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Proxy all API requests to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Keep-alive support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
    }
}
